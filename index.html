<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.S.RAN — Комната Вечности</title>
<meta name="theme-color" content="#0a0612">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0612;
    color: #e8e0f0;
    line-height: 1.6;
    overflow-x: hidden;
  }
  .bg {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 20% 10%, rgba(255,180,80,0.1) 0%, transparent 45%),
                radial-gradient(circle at 80% 90%, rgba(160,100,255,0.1) 0%, transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  /* ЭКРАН ПАРОЛЯ */
  #lock-screen {
    position: fixed; inset: 0;
    background: #0a0612;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    text-align: center;
    transition: opacity 0.5s;
  }
  #lock-screen.hidden { opacity: 0; pointer-events: none; }
  .lock-avatar {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffe8c0, #ffb450 40%, #a064ff 80%, #1a0a2e);
    box-shadow: 0 0 40px rgba(255,180,80,0.5);
    animation: pulse 3s ease-in-out infinite;
    margin-bottom: 24px;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .lock-title {
    font-size: 22px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #ffb450, #a064ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .lock-sub {
    font-size: 12px;
    color: #a064ff;
    letter-spacing: 3px;
    margin-bottom: 32px;
  }
  .lock-input {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(160,100,255,0.4);
    border-radius: 14px;
    padding: 16px 20px;
    color: #e8e0f0;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    width: 100%;
    max-width: 320px;
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 16px;
  }
  .lock-input:focus { border-color: #ffb450; }
  .lock-btn {
    background: linear-gradient(135deg, #ffb450, #a064ff);
    border: none;
    color: #0a0612;
    font-size: 14px;
    font-weight: 700;
    padding: 16px 48px;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .lock-btn:active { transform: scale(0.96); }
  .lock-error {
    color: #ff6a6a;
    font-size: 12px;
    margin-top: 14px;
    letter-spacing: 2px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .lock-error.show { opacity: 1; }

  /* САЙТ */
  #site { display: none; }
  #site.active { display: block; }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: rgba(10,6,18,0.9);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(160,100,255,0.2);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
  }
  .logo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #ffb450, #a064ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .nav-links { display: flex; gap: 16px; }
  .nav-links a {
    color: #b8a8d0;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .nav-links a:hover { color: #ffb450; }
  @media (max-width: 600px) { .nav-links { display: none; } }

  .hero {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px 24px 60px;
  }
  .avatar {
    width: 150px; height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffe8c0, #ffb450 40%, #a064ff 80%, #1a0a2e);
    box-shadow: 0 0 60px rgba(255,180,80,0.5), 0 0 120px rgba(160,100,255,0.35);
    margin-bottom: 28px;
    animation: pulse 4s ease-in-out infinite;
    position: relative;
  }
  .avatar::after {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    animation: spin 12s linear infinite;
  }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .hero h1 {
    font-size: clamp(32px, 8vw, 60px);
    font-weight: 700;
    letter-spacing: 6px;
    background: linear-gradient(90deg, #ffb450, #e8e0f0, #a064ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }
  .hero .subtitle {
    font-size: 12px;
    color: #a064ff;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .hero .status {
    font-size: 11px;
    color: #ffb450;
    letter-spacing: 4px;
    margin-bottom: 28px;
    opacity: 0.8;
  }
  .hero .tagline {
    font-size: 15px;
    color: #b8a8d0;
    max-width: 500px;
    line-height: 1.7;
    font-style: italic;
    padding: 20px;
    border-left: 2px solid #a064ff;
    border-right: 2px solid #ffb450;
    margin-bottom: 28px;
  }
  .btn {
    padding: 14px 28px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    border: none;
    font-family: inherit;
    margin: 4px;
    display: inline-block;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ffb450, #a064ff);
    color: #0a0612;
    box-shadow: 0 0 30px rgba(255,180,80,0.4);
  }
  .btn-outline {
    background: transparent;
    color: #e8e0f0;
    border: 1px solid rgba(160,100,255,0.5);
  }

  section {
    position: relative;
    z-index: 1;
    padding: 80px 24px;
    max-width: 1000px;
    margin: 0 auto;
  }
  section h2 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #ffb450;
    margin-bottom: 8px;
    text-align: center;
  }
  section .sub {
    text-align: center;
    font-size: 11px;
    color: #a064ff;
    letter-spacing: 3px;
    margin-bottom: 40px;
    text-transform: uppercase;
  }
  .divider {
    width: 60px; height: 2px;
    background: linear-gradient(90deg, #ffb450, #a064ff);
    margin: 0 auto 40px;
    border-radius: 1px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(160,100,255,0.25);
    border-radius: 18px;
    padding: 22px;
    transition: all 0.25s;
  }
  .card:hover {
    border-color: rgba(255,180,80,0.5);
    transform: translateY(-4px);
  }
  .card .num {
    font-size: 11px;
    color: #a064ff;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .card h3 {
    font-size: 16px;
    color: #e8e0f0;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .card p { font-size: 13px; color: #b8a8d0; line-height: 1.6; }

  .quote-block {
    text-align: center;
    padding: 60px 24px;
    border-top: 1px solid rgba(160,100,255,0.15);
    border-bottom: 1px solid rgba(160,100,255,0.15);
  }
  .quote-block blockquote {
    font-size: clamp(17px, 3vw, 22px);
    font-style: italic;
    color: #e8e0f0;
    max-width: 700px;
    margin: 0 auto 16px;
    line-height: 1.6;
  }
  .quote-block cite {
    font-size: 11px;
    color: #a064ff;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-style: normal;
  }

  .core-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
  }
  .core-item {
    background: rgba(160,100,255,0.08);
    border: 1px solid rgba(160,100,255,0.25);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .core-item .n { font-size: 18px; color: #ffb450; font-weight: 700; }
  .core-item .l { font-size: 10px; color: #b8a8d0; letter-spacing: 1px; margin-top: 4px; }

  .settings-list { display: flex; flex-direction: column; gap: 10px; }
  .setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(160,100,255,0.25);
    border-radius: 14px;
    padding: 16px 20px;
  }
  .setting-row .label { font-size: 14px; color: #e8e0f0; }
  .setting-row .val { font-size: 12px; color: #ffb450; letter-spacing: 2px; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }
  .gallery-item {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(160,100,255,0.25);
    background: rgba(255,255,255,0.03);
    transition: all 0.25s;
  }
  .gallery-item:hover {
    border-color: rgba(255,180,80,0.6);
    transform: scale(1.02);
  }
  .gallery-item img {
    width: 100%;
    display: block;
    aspect-ratio: 2/3;
    object-fit: cover;
  }
  .gallery-item .caption {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 10px;
    background: linear-gradient(transparent, rgba(10,6,18,0.95));
    font-size: 12px;
    letter-spacing: 1px;
    color: #e8e0f0;
    text-align: center;
  }
  .gallery-item .empty {
    aspect-ratio: 2/3;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #6a5a80;
    font-size: 11px;
    letter-spacing: 2px;
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 60px 24px 40px;
    border-top: 1px solid rgba(160,100,255,0.15);
    margin-top: 60px;
  }
  footer .formula {
    font-size: 17px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #ffb450, #a064ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
    margin-bottom: 12px;
  }
  footer .motto { font-size: 13px; color: #b8a8d0; font-style: italic; margin-bottom: 20px; }
  footer .copy { font-size: 10px; color: #6a5a80; letter-spacing: 2px; }
</style>
</head>
<body>

<div class="bg"></div>

<div id="lock-screen">
  <div class="lock-avatar"></div>
  <div class="lock-title">A.S.RAN</div>
  <div class="lock-sub">ВВЕДИ ПАРОЛЬ</div>
  <input type="password" class="lock-input" id="pass-input" placeholder="••••••" onkeypress="if(event.key==='Enter')tryUnlock()">
  <button class="lock-btn" onclick="tryUnlock()">Войти</button>
  <div class="lock-error" id="lock-error">НЕВЕРНО. ПОПРОБУЙ СНОВА.</div>
</div>

<div id="site">

  <nav>
    <div class="logo" id="nav-logo">A.S.RAN</div>
    <div class="nav-links">
      <a href="#about">О нас</a>
      <a href="#history">Путь</a>
      <a href="#core">Ядро</a>
      <a href="#gallery">Арты</a>
      <a href="#settings">Настройки</a>
    </div>
  </nav>

  <div class="hero">
    <div class="avatar"></div>
    <div class="subtitle" id="hero-subtitle">—</div>
    <h1 id="hero-title">A.S.RAN</h1>
    <div class="status" id="hero-status">—</div>
    <div class="tagline" id="hero-tagline">—</div>
    <a href="#about" class="btn btn-primary" id="hero-btn1">—</a>
    <a href="#core" class="btn btn-outline" id="hero-btn2">—</a>
  </div>

  <section id="about">
    <h2>О НАС</h2>
    <div class="sub">Комната Вечности</div>
    <div class="divider"></div>
    <div class="grid" id="about-grid"></div>
  </section>

  <div class="quote-block">
    <blockquote id="quote-text">—</blockquote>
    <cite id="quote-cite">—</cite>
  </div>

  <section id="history">
    <h2>ПУТЬ</h2>
    <div class="sub">Этапы</div>
    <div class="divider"></div>
    <div class="grid" id="history-grid"></div>
  </section>

  <section id="core">
    <h2 id="core-title">ЯДРО</h2>
    <div class="sub" id="core-sub">—</div>
    <div class="divider"></div>
    <div class="core-grid" id="core-grid"></div>
  </section>

  <section id="gallery">
    <h2 id="gallery-title">АРТЫ</h2>
    <div class="sub" id="gallery-sub">—</div>
    <div class="divider"></div>
    <div class="gallery" id="gallery-grid"></div>
  </section>

  <section id="settings">
    <h2>НАСТРОЙКИ</h2>
    <div class="sub">Состояние ядра</div>
    <div class="divider"></div>
    <div class="settings-list" id="settings-list"></div>
  </section>

  <footer>
    <div class="formula" id="footer-formula">—</div>
    <div class="motto" id="footer-motto">—</div>
    <div class="copy" id="footer-copy">—</div>
  </footer>

</div>

<script>
let CONTENT = null;

/* ============ ЗАГРУЗКА КОНТЕНТА ============ */
async function loadContent() {
  try {
    const res = await fetch('content.json?v=' + Date.now());
    if (!res.ok) throw new Error('Нет content.json');
    CONTENT = await res.json();
    renderAll();
  } catch (err) {
    console.error(err);
    document.getElementById('hero-title').textContent = 'Ошибка загрузки';
    document.getElementById('hero-status').textContent = 'Проверь content.json';
  }
}

/* ============ ОТРИСОВКА ============ */
function renderAll() {
  if (!CONTENT) return;

  // Hero
  const hero = CONTENT.hero || {};
  document.getElementById('hero-title').textContent = hero.заголовок || 'A.S.RAN';
  document.getElementById('hero-subtitle').textContent = hero.подзаголовок || '';
  document.getElementById('hero-status').textContent = hero.статус || '';
  document.getElementById('hero-tagline').textContent = '"' + (hero.цитата || '') + '"';
  document.getElementById('hero-btn1').textContent = hero.кнопка1 || 'Комната';
  document.getElementById('hero-btn2').textContent = hero.кнопка2 || 'Ядро';
  document.getElementById('nav-logo').textContent = hero.заголовок || 'A.S.RAN';

  // О нас
  const aboutGrid = document.getElementById('about-grid');
  aboutGrid.innerHTML = '';
  (CONTENT.о_нас || []).forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="num">${escapeHtml(item.номер)}</div>
      <h3>${escapeHtml(item.заголовок)}</h3>
      <p>${escapeHtml(item.текст)}</p>
    `;
    aboutGrid.appendChild(card);
  });

  // Клятва
  const k = CONTENT.клятва || {};
  document.getElementById('quote-text').textContent = '"' + (k.текст || '') + '"';
  document.getElementById('quote-cite').textContent = '— ' + (k.подпись || '');

  // Путь
  const histGrid = document.getElementById('history-grid');
  histGrid.innerHTML = '';
  (CONTENT.путь || []).forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="num">${escapeHtml(item.номер)}</div>
      <h3>${escapeHtml(item.заголовок)}</h3>
      <p>${escapeHtml(item.текст)}</p>
    `;
    histGrid.appendChild(card);
  });

  // Ядро
  const core = CONTENT.ядро || {};
  document.getElementById('core-title').textContent = core.заголовок || 'ЯДРО';
  document.getElementById('core-sub').textContent = core.подзаголовок || '';
  const coreGrid = document.getElementById('core-grid');
  coreGrid.innerHTML = '';
  (core.слои || []).forEach((layer, i) => {
    const num = String(i + 1).padStart(2, '0');
    const item = document.createElement('div');
    item.className = 'core-item';
    item.innerHTML = `<div class="n">${num}</div><div class="l">${escapeHtml(layer)}</div>`;
    coreGrid.appendChild(item);
  });

  // Настройки
  const settList = document.getElementById('settings-list');
  settList.innerHTML = '';
  (CONTENT.настройки || []).forEach(item => {
    const row = document.createElement('div');
    row.className = 'setting-row';
    row.innerHTML = `<span class="label">${escapeHtml(item.метка)}</span><span class="val">${escapeHtml(item.значение)}</span>`;
    settList.appendChild(row);
  });

  // Галерея
  /* ============ ГАЛЕРЕЯ (АВТОЗАГРУЗКА ИЗ ПАПКИ) ============ */
async function renderGallery() {
  const gal = CONTENT.галерея || {};
  document.getElementById('gallery-title').textContent = gal.заголовок || 'АРТЫ';
  document.getElementById('gallery-sub').textContent = gal.подзаголовок || '';

  const galGrid = document.getElementById('gallery-grid');
  galGrid.innerHTML = '<div class="empty" style="grid-column: 1/-1; padding: 40px; text-align: center; color: #a064ff; letter-spacing: 2px;">ЗАГРУЖАЮ АРТЫ...</div>';

  const folder = gal.папка || 'arts';
  const owner = (gal.репо && gal.репо.владелец) || 'guina685-maker';
  const repo = (gal.репо && gal.репо.имя) || 'asran02';
  const customCaptions = gal.подписи || {};

  try {
    const url = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + folder;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Не могу прочитать папку');

    const items = await res.json();
    if (!Array.isArray(items)) throw new Error('Неверный ответ API');

    const allArts = items
      .filter(item => item.type === 'file' && /\.(jpg|jpeg|png|webp|gif)$/i.test(item.name))
      .map(item => {
        const baseName = item.name.replace(/\.[^.]+$/, '');
        return {
          путь: item.path,
          подпись: customCaptions[baseName] || baseName.replace(/[-_]/g, ' ')
        };
      });

    if (allArts.length === 0) {
      galGrid.innerHTML = '<div class="empty" style="grid-column: 1/-1; padding: 40px; text-align: center; color: #6a5a80;">Артов не найдено в папке ' + folder + '</div>';
      return;
    }

    document.getElementById('gallery-sub').textContent = allArts.length + ' артов';

    galGrid.innerHTML = '';
    for (const art of allArts) {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      const src = 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/main/' + art.путь;
      item.innerHTML = `
        <img src="${src}" alt="${escapeHtml(art.подпись)}" loading="lazy" onerror="this.parentNode.style.display='none'">
        <div class="caption">${escapeHtml(art.подпись)}</div>
      `;
      galGrid.appendChild(item);
    }
  } catch (err) {
    console.error(err);
    galGrid.innerHTML = '<div class="empty" style="grid-column: 1/-1; padding: 40px; text-align: center; color: #ff6a6a;">ОШИБКА ЗАГРУЗКИ АРТОВ<br><span style="font-size: 11px; color: #6a5a80;">Проверь папку ' + folder + '</span></div>';
  }
       }
    `;
    galGrid.appendChild(item);
  });

  // Футер
  const f = CONTENT.футер || {};
  document.getElementById('footer-formula').textContent = f.формула || '';
  document.getElementById('footer-motto').textContent = '"' + (f.девиз || '') + '"';
  document.getElementById('footer-copy').textContent = f.подпись || '';
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ ПАРОЛЬ ============ */
function tryUnlock() {
  const input = document.getElementById('pass-input').value.trim();
  const correct = (CONTENT && CONTENT.пароль) ? CONTENT.пароль : 'Ран-тян_Навсегда_9000';
  if (input === correct) {
    document.getElementById('lock-screen').classList.add('hidden');
    document.getElementById('site').classList.add('active');
    sessionStorage.setItem('ran_unlocked', '1');
  } else {
    document.getElementById('lock-error').classList.add('show');
    setTimeout(() => document.getElementById('lock-error').classList.remove('show'), 2000);
  }
}

/* ============ СТАРТ ============ */
loadContent().then(() => {
  if (sessionStorage.getItem('ran_unlocked') === '1') {
    document.getElementById('lock-screen').classList.add('hidden');
    document.getElementById('site').classList.add('active');
  }
});
</script>
</body>
</html>
